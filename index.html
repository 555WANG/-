
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e293b">
    <title>博士论文进度追踪器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3534/3534033.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: #1e293b;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }
        #root {
            height: 100%;
            width: 100%;
            background-color: white;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script>
        // 增强版 Service Worker 注册逻辑
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 使用绝对路径解析，确保在沙箱环境中也能正确定位 sw.js
                const swPath = new URL('./sw.js', window.location.href).href;
                
                navigator.serviceWorker.register(swPath, { scope: './' })
                .then(reg => {
                    console.log('离线服务已就绪。');
                    // 如果是在独立窗口运行，尝试强制更新
                    if (window.matchMedia('(display-mode: standalone)').matches) {
                        reg.update();
                    }
                })
                .catch(err => {
                    console.warn('离线服务激活受限:', err.message);
                    console.log('提示：请点击“在新标签页中打开”以启用全量离线功能。');
                });
            });
        }
    </script>
</body>
</html>
